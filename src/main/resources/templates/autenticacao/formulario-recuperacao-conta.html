<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Redefinir senha</title>
</head>

<body>
<main class="container">
    <section class="card form-card">
        <h2 class="title">Redefinir senha</h2>

        <div class="alert alert-danger text-center text-uppercase" th:if="${erro}">
            <p th:text="${erro}"></p>
        </div>

        <form method="post" th:action="@{/recuperar-conta}">
            <input type="hidden" name="codigo" th:value="${param.codigo}">

            <div class="form-group">
                <label for="novaSenha" class="required">Nova senha:</label>
                <input id="novaSenha" name="novaSenha" type="password" class="form-control"
                       placeholder="Nova senha" required="required">
            </div>

            <div class="form-group">
                <label for="novaSenhaConfirmacao" class="required">Confirme a nova senha:</label>
                <input id="novaSenhaConfirmacao" name="novaSenhaConfirmacao" type="password" class="form-control"
                       placeholder="Confirme a nova senha" required="required">
            </div>

            <button class="btn btn-primary" title="Salvar">
                Salvar
            </button>
        </form>
    </section>
</main>
</body>
</html>
